# The NervesHub layer.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nerveshub"
BBFILE_PATTERN_nerveshub = "^${LAYERDIR}/"
BBFILE_PRIORITY_nerveshub = "6"

# meta-rauc, whose collection is named "rauc". The agent shells out to
# `rauc install`, so the recipe RDEPENDS on it; declaring it here fails at
# layer-add time with a clear message rather than at build time with
# "Nothing RPROVIDES".
LAYERDEPENDS_nerveshub = "core rauc"
# No released Yocto ships a Rust new enough to build this yet -- scarthgap has
# cargo 1.75 and walnascar 1.84, against an agent that needs 1.88. The compat
# list is deliberately optimistic rather than empty: the recipe itself is
# correct on scarthgap (it parses, fetches and reaches do_compile), and only
# the toolchain stops it. See README.md for the options.
LAYERSERIES_COMPAT_nerveshub = "scarthgap styhead walnascar whinlatter"
