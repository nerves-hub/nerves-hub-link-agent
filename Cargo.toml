[package]
name = "nerves-hub-link-agent"
version = "0.1.0"
edition = "2021"
# Tested in CI, not guessed. This decides which Buildroot and Yocto releases
# can build the agent, so it is worth keeping as low as the ecosystem allows.
#
# 1.85 is where edition 2024 was stabilised, and that is the binding
# constraint: crates the agent genuinely compiles (zeroize through rustls,
# hashbrown through toml) have moved to it, and a cargo older than 1.85 cannot
# parse their manifests to vendor them. Nothing here can lower it further
# without pinning a widening set of transitive crates below their releases.
rust-version = "1.85"
description = "NervesHub device agent for Linux, with pluggable firmware update tools"
license = "Apache-2.0"

[lib]
name = "nerves_hub_link_agent"
path = "src/lib.rs"

[[bin]]
name = "nerves-hub-link-agent"
path = "src/main.rs"

# The only thing on a minimal image that can reach the agent's socket. Without
# it `mark-valid` is unreachable from a support script, which is where it most
# needs to be reachable from.
[[bin]]
name = "agent-ctl"
path = "src/bin/agent-ctl.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# Shared-secret authentication. Pure Rust so the token construction can be
# tested on the host against vectors a running NervesHub accepted.
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# A websocket, a unix socket, a child process and a pile of timeouts. Threads
# would work, but every deadline in `ipc::policy` becomes a manual affair and
# this is not a device where a megabyte of runtime is the constraint.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "process",
    "io-util",
    "signal",
    "sync",
    "fs",
] }
# TLS is rustls rather than the system OpenSSL, and that is a packaging
# decision more than a cryptographic one. With native-tls the binary links
# libssl.so.3 and libcrypto.so.3, which means the target image must carry a
# matching OpenSSL and a cross-build must find its headers -- the single most
# annoying part of putting a Rust binary into a Buildroot or Yocto image. With
# rustls the agent depends on nothing but libc.
#
# Roots come from the platform store via rustls-native-certs, so a device that
# already trusts a private CA needs no extra configuration here.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# hyper directly rather than reqwest. The agent makes two kinds of request -- a
# streaming GET for firmware and a small JSON GET for geo -- and reqwest costs
# far more than that is worth on a device: it carries an optional QUIC stack
# whose `chacha20` uses edition 2024, and because a lockfile records the
# maximal resolution rather than the enabled one, vendoring it needs cargo
# 1.85+ even though nothing here compiles a byte of it. That single unused
# dependency is what put the agent out of reach of every released Yocto.
#
# The `url` crate is avoided for the same reason: it reaches idna and icu,
# which want 1.86 and 1.88. Redirects are resolved against `http::Uri` instead.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "client-legacy",
    "http1",
    "tokio",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http1",
    "tls12",
] }
http-body-util = "0.1"
bytes = "1"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "process"] }

[features]
# The sandbox tool is in the default set deliberately: a build that has not
# been told which real updater to use should not be able to write to a disk.
default = ["sandbox", "fwup"]

sandbox = []
fwup = []
rauc = []

# Extensions are opt-in at build time as well as at runtime. `local_shell` is
# the one that matters: it is the only extension that lets someone reach into
# the device rather than read from it, and a build that cannot serve a shell
# cannot be talked into serving one by a config file.
