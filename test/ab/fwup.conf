# A minimal A/B layout, in the shape Nerves uses.
#
# Two rootfs partitions and an MBR that decides which one is "first". An upgrade
# writes the slot that is *not* currently first, then rewrites the MBR to point
# at it. Which slot is live is therefore a property of the image itself, not of
# anything remembered elsewhere — so fwup can work it out by reading the target,
# whether that target is a disk or a file.

require-fwup-version="1.0.0"

# NervesHub reads these by running `fwup -m -i <archive>` and parsing the
# `meta-` lines. Four of them are mandatory — product, version, platform and
# architecture — and an archive missing any is rejected at upload with a
# metadata error rather than a helpful one.
#
# `meta-uuid` is not here because fwup derives it from the archive contents. It
# is stable for identical input, which means a reproducible build produces the
# same UUID and NervesHub treats it as the same firmware.
meta-product = "${NH_PRODUCT}"
meta-version = "${NH_VERSION}"
meta-platform = "${NH_PLATFORM}"
meta-architecture = "${NH_ARCHITECTURE}"
meta-description = "test A/B image for nerves-hub-link-agent"

define(ROOTFS_A_PART_OFFSET, 2048)
define(ROOTFS_A_PART_COUNT, 2048)
define(ROOTFS_B_PART_OFFSET, 4096)
define(ROOTFS_B_PART_COUNT, 2048)

file-resource rootfs.img {
    host-path = "${ROOTFS_PATH}"
}

# Partition 0 is the live slot. The two layouts differ only in which offset that
# is, which is what makes "which slot am I on" readable with fdisk.
mbr mbr-a {
    partition 0 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
    partition 1 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
}

mbr mbr-b {
    partition 0 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
}

# Writes the whole target: partition table and slot A. What a factory does.
task complete {
    on-init { mbr_write(mbr-a) }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
}

# Running on A, so write B. fwup picks between these by testing the
# requirements against the target, which is how `-t upgrade` knows which slot
# is free without being told.
task upgrade.b {
    require-partition-offset(0, ${ROOTFS_A_PART_OFFSET})
    on-resource rootfs.img { raw_write(${ROOTFS_B_PART_OFFSET}) }
    on-finish { mbr_write(mbr-b) }
}

# Running on B, so write A.
task upgrade.a {
    require-partition-offset(0, ${ROOTFS_B_PART_OFFSET})
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-finish { mbr_write(mbr-a) }
}
