# A real A/B firmware image, sized for a real rootfs.
#
# Same shape as test/ab/fwup.conf — two rootfs slots and an MBR that names the
# live one — but with partitions big enough for an actual Linux userland, and a
# data partition that an upgrade never touches.
#
# The rootfs itself is built elsewhere; see test/image/build.sh. fwup packages
# and writes, it does not build a distribution.

require-fwup-version="1.0.0"

meta-product = "${NH_PRODUCT}"
meta-version = "${NH_VERSION}"
meta-platform = "${NH_PLATFORM}"
meta-architecture = "${NH_ARCHITECTURE}"
meta-description = "nerves-hub-link-agent test image"

# 512 MB per rootfs slot. Two of them, because A/B costs twice the space —
# which is the trade for being able to fall back to a working system.
define(ROOTFS_A_PART_OFFSET, 2048)
define(ROOTFS_A_PART_COUNT, 1048576)

define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, 1048576)

# Everything that has to outlive an upgrade: the device's identity, the agent's
# own state, application data. Formatted once at the factory and never written
# by an upgrade task — which is the whole reason it is a separate partition.
define-eval(DATA_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(DATA_PART_COUNT, 1048576)

file-resource rootfs.img {
    host-path = "${ROOTFS_PATH}"
}

mbr mbr-a {
    partition 0 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
    partition 1 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
    partition 2 {
        block-offset = ${DATA_PART_OFFSET}
        block-count = ${DATA_PART_COUNT}
        type = 0x83
    }
}

mbr mbr-b {
    partition 0 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
    partition 2 {
        block-offset = ${DATA_PART_OFFSET}
        block-count = ${DATA_PART_COUNT}
        type = 0x83
    }
}

task complete {
    on-init { mbr_write(mbr-a) }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
}

task upgrade.b {
    require-partition-offset(0, ${ROOTFS_A_PART_OFFSET})
    on-resource rootfs.img { raw_write(${ROOTFS_B_PART_OFFSET}) }
    on-finish { mbr_write(mbr-b) }
}

task upgrade.a {
    require-partition-offset(0, ${ROOTFS_B_PART_OFFSET})
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-finish { mbr_write(mbr-a) }
}
