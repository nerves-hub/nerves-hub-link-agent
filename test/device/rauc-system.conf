# RAUC's description of the A/B layout.
#
# RAUC writes the inactive slot and then records its choice in the u-boot
# environment: the new slot goes first in BOOT_ORDER with a fresh attempt count.
# test/device/rauc-boot.cmd reads that and boots accordingly, so the decision
# belongs to RAUC and the script only carries it out.
#
# Which slot is *running* comes back the other way, as `rauc.slot=` on the
# kernel command line.
#
# The bootnames are lowercase because that is what `fw_active` holds, and the
# boot script passes it through unchanged. A case mismatch here does not fail
# loudly — RAUC simply finds no booted slot and the service exits.

[system]
compatible=nerves-hub-agent-qemu
bootloader=uboot
# Outside the rootfs, because an update overwrites the whole slot and RAUC's
# record of what it installed has to outlive that.
statusfile=/data/rauc.status

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/vda1
type=ext4
bootname=a

[slot.rootfs.1]
device=/dev/vda2
type=ext4
bootname=b
