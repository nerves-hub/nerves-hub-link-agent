# Post-install operations, shipped *in* the firmware rather than applied to it.
#
# `fwup -t validate` is how this device says an update worked, and the task
# lives here — beside the upgrade tasks that wrote `fw_validated=0` — for one
# reason: the file that sets a flag should be the file that clears it. The
# alternative, an `fw_setenv fw_validated 1` in the agent's configuration, puts
# the variable's name in two places. The two drifted apart the first time this
# project renamed them, which is the bug this file exists to make impossible.
#
# The archive carries no resources. It is here so a device holding no copy of
# its own firmware can still run a task against its bootloader environment,
# which is the same job Nerves gives revert.fw.
#
# There is no `revert` task. Rollback is the boot counter's, and u-boot decides
# it without asking Linux — which is the whole point, since a device that needs
# to revert is usually one that cannot be relied on to ask. A manual revert
# would also have to rewrite the unprefixed `fw_uuid` to the other slot's, and
# fwup cannot read `${${fw_active}.fw_uuid}` to do it.
#
# UBOOT_ENV_OFFSET and UBOOT_ENV_COUNT must match fwup.conf. package.sh checks
# that they do, rather than trusting this comment to be read.
define(UBOOT_ENV_OFFSET, 1024)
define(UBOOT_ENV_COUNT, 256)

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# Marks the running slot good.
#
# Deliberately indifferent to *which* slot is running: validation is a claim
# about this boot, and `fw_active` already names the slot the claim is about.
# That also makes the task safe to run twice.
task validate {
    on-init {
        uboot_setenv(uboot-env, "fw_validated", "1")
    }
}
