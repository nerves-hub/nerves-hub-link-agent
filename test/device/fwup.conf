# The bootable A/B image, with u-boot choosing the slot.
#
# # What changed, and why
#
# The earlier layout swapped the MBR so that partition *entry 0* was always the
# live slot, and `root=/dev/vda1` followed it. That works with no bootloader at
# all, which is exactly why it was worth doing first — but it cannot roll back.
# Reverting means deciding, at boot, that the slot you were told to use has
# failed, and nothing in Linux gets to make that decision before Linux runs.
#
# So slot selection moves into the environment. `fw_active` says which
# slot to boot, u-boot reads it, and rollback becomes a variable u-boot can
# change. The partition table is now fixed: entry 0 is always slot A.
#
# This is the arrangement Nerves uses, and the flags are the ones it uses.
#
# # Naming
#
# The variables are `fw_*`, not `nerves_fw_*`. This is not a Nerves system and
# the prefix would imply a dependency that does not exist. NervesHub's *wire*
# protocol does use `nerves_fw_*` — that is what the server parses from a join —
# but that is the platform's name for the message, not the device's name for
# its own storage, and the agent maps between them.
#
# # Metadata is recorded per slot
#
# Each slot's identity is written under its own prefix — `a.fw_uuid`,
# `b.fw_version` — and `fw_active` names which slot to boot. This
# is the arrangement Nerves uses and the reason is rollback: with a single
# unprefixed set of variables, reverting to the other slot leaves the
# environment describing firmware that is no longer running, and the device
# reports the version that just failed as though it had succeeded.
#
# # One environment, three readers
#
# The u-boot environment block is written by fwup when it applies an update,
# read and written by Linux through `fw_printenv`/`fw_setenv`, and read by
# u-boot at boot with `virtio read` + `env import -c`. It is a plain CRC'd blob
# at a fixed offset, so none of the three needs the others to be running.

require-fwup-version="1.0.0"

meta-product = "${NH_PRODUCT}"
meta-version = "${NH_VERSION}"
meta-platform = "${NH_PLATFORM}"
meta-architecture = "${NH_ARCHITECTURE}"
meta-description = "nerves-hub-link-agent bootable test image"

# Where the environment lives. The offsets are repeated in three places that
# must agree — here, /etc/fw_env.config in the rootfs, and the `virtio read` in
# the boot script — and a mismatch reads as a bad CRC rather than as a mistake.
define(UBOOT_ENV_OFFSET, 1024)
define(UBOOT_ENV_COUNT, 256)

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

define(ROOTFS_A_PART_OFFSET, 2048)
define(ROOTFS_A_PART_COUNT, 2097152)

define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, 2097152)

define-eval(DATA_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(DATA_PART_COUNT, 524288)

file-resource rootfs.img {
    host-path = "${ROOTFS_PATH}"
}

file-resource data.img {
    host-path = "${DATA_PATH}"
}

# Fixed. Slot A is always partition 1 and slot B always partition 2, so
# `/dev/vda1` and `/dev/vda2` mean the same thing on every boot and u-boot can
# name one of them.
mbr mbr-fixed {
    partition 0 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
    partition 1 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
    partition 2 {
        block-offset = ${DATA_PART_OFFSET}
        block-count = ${DATA_PART_COUNT}
        type = 0x83
    }
}

task complete {
    on-init {
        mbr_write(mbr-fixed)
        uboot_clearenv(uboot-env)
    }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-resource data.img { raw_write(${DATA_PART_OFFSET}) }
    on-finish {
        uboot_setenv(uboot-env, "a.fw_uuid", "${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "a.fw_product", "${NH_PRODUCT}")
        uboot_setenv(uboot-env, "a.fw_version", "${NH_VERSION}")
        uboot_setenv(uboot-env, "a.fw_platform", "${NH_PLATFORM}")
        uboot_setenv(uboot-env, "a.fw_architecture", "${NH_ARCHITECTURE}")

        # A factory image is trusted: there is no previous slot to fall back to,
        # so there is nothing a validation could protect.
        uboot_setenv(uboot-env, "fw_active", "a")
        uboot_setenv(uboot-env, "fw_validated", "1")

        # A copy of the active slot's UUID under the bare name. The boot script
        # tags its rollback override with this, and u-boot cannot expand
        # `${${fw_active}.fw_uuid}` — it has no nested expansion.
        # Everything that can resolve the prefix reads the prefixed value; this
        # exists only for the script.
        uboot_setenv(uboot-env, "fw_uuid", "${FWUP_META_UUID}")
    }
}

# Which slot is free is now a question about the environment rather than the
# partition table, so the two upgrade tasks are chosen on `fw_active`.
task upgrade.b {
    require-uboot-variable(uboot-env, "fw_active", "a")
    on-resource rootfs.img { raw_write(${ROOTFS_B_PART_OFFSET}) }
    on-finish {
        uboot_setenv(uboot-env, "b.fw_uuid", "${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "b.fw_product", "${NH_PRODUCT}")
        uboot_setenv(uboot-env, "b.fw_version", "${NH_VERSION}")
        uboot_setenv(uboot-env, "b.fw_platform", "${NH_PLATFORM}")
        uboot_setenv(uboot-env, "b.fw_architecture", "${NH_ARCHITECTURE}")

        # Unvalidated, and the previous slot recorded explicitly so a rollback
        # does not have to infer the layout.
        uboot_setenv(uboot-env, "fw_active", "b")
        uboot_setenv(uboot-env, "fw_validated", "0")
        uboot_setenv(uboot-env, "fw_previous", "a")
        uboot_setenv(uboot-env, "fw_uuid", "${FWUP_META_UUID}")
    }
}

task upgrade.a {
    require-uboot-variable(uboot-env, "fw_active", "b")
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-finish {
        uboot_setenv(uboot-env, "a.fw_uuid", "${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "a.fw_product", "${NH_PRODUCT}")
        uboot_setenv(uboot-env, "a.fw_version", "${NH_VERSION}")
        uboot_setenv(uboot-env, "a.fw_platform", "${NH_PLATFORM}")
        uboot_setenv(uboot-env, "a.fw_architecture", "${NH_ARCHITECTURE}")

        uboot_setenv(uboot-env, "fw_active", "a")
        uboot_setenv(uboot-env, "fw_validated", "0")
        uboot_setenv(uboot-env, "fw_previous", "b")
        uboot_setenv(uboot-env, "fw_uuid", "${FWUP_META_UUID}")
    }
}
