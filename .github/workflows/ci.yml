name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Warnings fail here rather than accumulating. The four that existed
      # before this workflow did were all real, and one of them was an import
      # that only the test build used.
      - run: cargo clippy --all-features --all-targets -- -D warnings

      - run: cargo test --all-features

      # The version comes out of the Dockerfile so the two cannot drift: the
      # integration tests assert against fwup's behaviour, and testing a
      # different fwup from the one the device images carry would prove
      # something about neither.
      - name: install fwup
        run: |
          version="$(sed -n 's/^ARG FWUP_VERSION=//p' Dockerfile | head -1)"
          echo "installing fwup ${version}"
          curl -fsSL -o /tmp/fwup.deb \
            "https://github.com/fwup-home/fwup/releases/download/v${version}/fwup_${version}_amd64.deb"
          sudo dpkg -i /tmp/fwup.deb
          fwup --version

      # `--ignored` is the whole point of this step. These tests drive a real
      # fwup against a real A/B image and are skipped by default because a
      # laptop has no fwup; skipped in CI as well they would never run at all.
      - run: cargo test --all-features -- --ignored

  msrv:
    name: minimum supported rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read from Cargo.toml so the two cannot disagree. The declared version
      # was wrong by eleven minor releases before anything checked it, and the
      # first thing to notice was a Buildroot image failing to vendor the lock.
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-features --locked

  features:
    name: features (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A device builds only the tool it has, so each of these is a shape
        # someone actually ships. `rauc` is the one that matters most: it is
        # not in the default set, so nothing else here compiles it.
        #
        # `id` is carried separately because it becomes the cache key, and a
        # cache key may not contain a comma -- with the flags used directly,
        # the two combinations containing one failed key validation and those
        # jobs rebuilt from scratch on every run. It reads better as a job name
        # than the flags do, too.
        include:
          - id: sandbox
            flags: --no-default-features --features sandbox
          - id: fwup
            flags: --no-default-features --features fwup
          - id: rauc
            flags: --no-default-features --features rauc
          - id: all
            flags: --all-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.id }}
      - run: cargo check --all-targets ${{ matrix.flags }}

  images:
    name: device images
    # arm64 by construction, not by preference: the u-boot stages run
    # `make qemu_arm64_defconfig && make` with no CROSS_COMPILE, so they only
    # build in an arm64 container. These runners are free for public repos and
    # match what the rigs are developed on.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        scheme: [fwup, rauc]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Two files the image build copies in: the rig's ssh public key for
      # authorized_keys, and the certificate RAUC uses as its keyring. CI never
      # boots the image or installs a bundle, so throwaways keep the Dockerfile
      # honest without committing either.
      - name: generate throwaway rig keys
        run: |
          mkdir -p tmp/keys
          ssh-keygen -t ed25519 -N '' -C ci -f tmp/keys/qemu_ed25519
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=ci-throwaway' \
            -keyout tmp/keys/rauc-key.pem \
            -out tmp/keys/rauc-cert.pem

      - name: build the ${{ matrix.scheme }} device image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BOOT_SCHEME=${{ matrix.scheme }}
          push: false
          cache-from: type=gha,scope=device-${{ matrix.scheme }}
          cache-to: type=gha,mode=max,scope=device-${{ matrix.scheme }}
